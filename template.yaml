AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Encompass API Passthrough & Middleware Gateway: field-filtered read proxy,
  async FIFO write pipeline with retries, role-scoped API key portal, field
  schema discovery, eFolder document/attachment passthrough, enhanced condition
  read/respond, and request-ID-correlated access logs and alarms.

Parameters:
  EncompassInstanceId:
    Type: String
    MinLength: 1
    Description: Encompass instance ID, e.g. BE11122233.
  EncompassClientId:
    Type: String
    MinLength: 1
    Description: Encompass OAuth client ID for this instance.
  EncompassClientSecret:
    Type: String
    NoEcho: true
    MinLength: 1
    Description: Encompass OAuth client secret. Stored in Secrets Manager.
  TitleInviteCode:
    Type: String
    NoEcho: true
    MinLength: 24
    Description: Invite code for title/settlement partners (role=title).
  BrokerInviteCode:
    Type: String
    NoEcho: true
    MinLength: 24
    Description: Invite code for TPO/broker partners (role=broker).
  AppraisalInviteCode:
    Type: String
    NoEcho: true
    MinLength: 24
    Description: Invite code for AMC/appraisal partners (role=appraisal).
  TitleServiceUserId:
    Type: String
    Default: api_title_template
    MinLength: 1
    Description: Encompass service account impersonated by title invite links.
  BrokerServiceUserId:
    Type: String
    Default: api_broker_template
    MinLength: 1
    Description: Encompass service account impersonated by broker invite links.
  AppraisalServiceUserId:
    Type: String
    Default: api_appraisal_template
    MinLength: 1
    Description: Encompass service account impersonated by appraisal invite links.
  OpsAlertEmail:
    Type: String
    Default: ""
    Description: Optional email for DLQ alarm notifications. Confirm the SNS subscription.
  TitleWriteFields:
    Type: String
    Default: ""
    Description: Optional comma-separated field IDs the title role may write. Empty allows any valid field.
  BrokerWriteFields:
    Type: String
    Default: ""
    Description: Optional comma-separated field IDs the broker role may write. Empty allows any valid field.
  AppraisalWriteFields:
    Type: String
    Default: ""
    Description: Optional comma-separated field IDs the appraisal role may write. Empty allows any valid field.
  EncompassBaseUrl:
    Type: String
    Default: https://api.elliemae.com
    Description: Encompass API base URL.
  LogRetentionInDays:
    Type: Number
    Default: 30
    MinValue: 1
    MaxValue: 3653

Conditions:
  HasOpsAlertEmail: !Not [!Equals [!Ref OpsAlertEmail, ""]]

Resources:
  EncompassSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AWS::StackName}/encompass-client-secret"
      Description: Encompass OAuth client secret used by the passthrough gateway.
      SecretString: !Ref EncompassClientSecret

  TenantsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: apiKeyId
          AttributeType: S
      KeySchema:
        - AttributeName: apiKeyId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true

  ProvisioningTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: provisioningKey
          AttributeType: S
      KeySchema:
        - AttributeName: provisioningKey
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  TokensTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: encompassUserId
          AttributeType: S
      KeySchema:
        - AttributeName: encompassUserId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  JobsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: jobId
          AttributeType: S
      KeySchema:
        - AttributeName: jobId
          KeyType: HASH
      SSESpecification:
        SSEEnabled: true
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-writes-dlq.fifo"
      FifoQueue: true
      MessageRetentionPeriod: 345600
      SqsManagedSseEnabled: true

  OpsAlertTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: !Sub "${AWS::StackName} gateway alerts"
      KmsMasterKeyId: alias/aws/sns

  OpsAlertSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasOpsAlertEmail
    Properties:
      TopicArn: !Ref OpsAlertTopic
      Protocol: email
      Endpoint: !Ref OpsAlertEmail

  DeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Write jobs reached the DLQ; inspect the queue and job records.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt DeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlertTopic

  GatewayErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Gateway Lambda errors; search CloudWatch logs for the request ID.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref GatewayFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlertTopic

  Api5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: API Gateway 5XX responses; correlate the request ID with access logs.
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: !Sub "${AWS::StackName}-api"
        - Name: Stage
          Value: !Ref ApiStage
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref OpsAlertTopic

  WriteQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-writes.fifo"
      FifoQueue: true
      ContentBasedDeduplication: false
      VisibilityTimeout: 120
      MessageRetentionPeriod: 86400
      SqsManagedSseEnabled: true
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt DeadLetterQueue.Arn
        maxReceiveCount: 5

  GatewayRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: gateway-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                Resource:
                  - !GetAtt TenantsTable.Arn
                  - !GetAtt ProvisioningTable.Arn
                  - !GetAtt TokensTable.Arn
                  - !GetAtt JobsTable.Arn
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:ReceiveMessage
                  - sqs:DeleteMessage
                  - sqs:ChangeMessageVisibility
                  - sqs:GetQueueAttributes
                Resource:
                  - !GetAtt WriteQueue.Arn
                  - !GetAtt DeadLetterQueue.Arn
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref EncompassSecret
              - Effect: Allow
                Action: apigateway:POST
                Resource:
                  - !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/apikeys"
                  - !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/usageplans/${UsagePlan}/keys"
              - Effect: Allow
                Action:
                  - apigateway:GET
                  - apigateway:DELETE
                Resource:
                  - !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/apikeys/*"
                  - !Sub "arn:${AWS::Partition}:apigateway:${AWS::Region}::/usageplans/${UsagePlan}/keys/*"
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-gateway:*"

  GatewayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${GatewayFunction}"
      RetentionInDays: !Ref LogRetentionInDays

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apigateway/${AWS::StackName}-access"
      RetentionInDays: !Ref LogRetentionInDays

  GatewayFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-gateway"
      Description: Encompass passthrough gateway (portal, reads, async writes).
      Runtime: nodejs24.x
      Handler: index.handler
      Architectures:
        - arm64
      MemorySize: 256
      Timeout: 29
      Role: !GetAtt GatewayRole.Arn
      Environment:
        Variables:
          TENANT_TABLE: !Ref TenantsTable
          PROVISIONING_TABLE: !Ref ProvisioningTable
          TOKEN_TABLE: !Ref TokensTable
          JOB_TABLE: !Ref JobsTable
          WRITE_QUEUE_URL: !Ref WriteQueue
          USAGE_PLAN_ID: !Ref UsagePlan
          ENCOMPASS_BASE_URL: !Ref EncompassBaseUrl
          ENCOMPASS_CLIENT_ID: !Ref EncompassClientId
          ENCOMPASS_INSTANCE_ID: !Ref EncompassInstanceId
          ENCOMPASS_SECRET_ARN: !Ref EncompassSecret
          INVITE_TITLE: !Ref TitleInviteCode
          INVITE_BROKER: !Ref BrokerInviteCode
          INVITE_APPRAISAL: !Ref AppraisalInviteCode
          PERSONA_TITLE: !Ref TitleServiceUserId
          PERSONA_BROKER: !Ref BrokerServiceUserId
          PERSONA_APPRAISAL: !Ref AppraisalServiceUserId
          WRITE_FIELDS_TITLE: !Ref TitleWriteFields
          WRITE_FIELDS_BROKER: !Ref BrokerWriteFields
          WRITE_FIELDS_APPRAISAL: !Ref AppraisalWriteFields
      Code:
        ZipFile: |
         "use strict";
         /**
         * Encompass API Passthrough & Middleware Gateway - single Lambda handler.
         *
         * Handles both API Gateway proxy events (admin portal, field-filtered reads,
         * async write enqueue, job status) and SQS FIFO write events.
         *
         * Runtime: Node.js 24.x. No runtime dependencies beyond the AWS SDK v3 that
         * ships with the Lambda runtime, so it can be embedded as CloudFormation
         * inline code (ZipFile).
         */
         const { AsyncLocalStorage } = require("node:async_hooks");
         const { createHash, randomUUID, timingSafeEqual } = require("node:crypto");
         const DEFAULT_FIELDS = "11,12,14,1109";
         const MAX_FIELDS = 100;
         const TOKEN_SKEW_SECONDS = 300;
         const READ_CACHE_TTL_MS = 30_000;
         const READ_CACHE_MAX_ENTRIES = 500;
         const MAX_ATTEMPTS = 5;
         const JOB_TTL_SECONDS = 30 * 24 * 60 * 60;
         const PROVISIONING_LOCK_TTL_SECONDS = 15 * 60;
         const PROVISIONING_TTL_SECONDS = 24 * 60 * 60;
         const FIELD_ID = /^[A-Za-z0-9._]+$/;
         const CONDITION_ID = /^[A-Za-z0-9._:-]+$/;
         const MAX_CONDITION_UPDATES = 20;
         const MAX_DOWNLOAD_IDS = 20;
         const MAX_BODY_BYTES = 10_000;
         const MAX_APPLICATION_BYTES = 1_000_000;
         const STANDARD_CONDITION_TYPES = new Set(["underwriting", "preliminary", "postclosing"]);
         const DOCUMENT_QUERY_KEYS = ["requireActiveAttachments", "includeRemoved", "view", "start", "limit"];
         const CONDITION_QUERY_KEYS = ["conditionType", "includeRemoved", "view", "start", "limit"];
         const READ_ONLY_CONDITION_FIELDS = ["status", "statusDate", "statusOpen"];
         const SCHEMA_CACHE_TTL_MS = 5 * 60_000;
         const SCHEMA_CACHE_MAX_ENTRIES = 200;
         const STANDARD_FIELDS_PATH = "/encompass/v3/schemas/loan/standardFields";
         const CUSTOM_FIELDS_PATH = "/encompass/v3/settings/loan/customFields";
         const ROLE_CONFIG = {
         title: { label: "Title / Settlement", codeEnv: "INVITE_TITLE", personaEnv: "PERSONA_TITLE" },
         broker: { label: "TPO / Broker", codeEnv: "INVITE_BROKER", personaEnv: "PERSONA_BROKER" },
         appraisal: { label: "AMC / Appraisal", codeEnv: "INVITE_APPRAISAL", personaEnv: "PERSONA_APPRAISAL" },
         };
         // Curated cheat sheet for the portal. The dynamic schema route is the source
         // of truth for everything else, including CX.* custom fields.
         const FIELD_CATALOG = [
         { category: "Property", name: "Street Address", id: "11", type: "STRING", sample: '"123 Main St"' },
         { category: "Property", name: "City", id: "12", type: "STRING", sample: '"Irvine"' },
         { category: "Property", name: "State", id: "14", type: "STRING", sample: '"CA"' },
         { category: "Property", name: "Zip", id: "15", type: "STRING", sample: '"92618"' },
         { category: "Loan Terms", name: "Loan Amount", id: "1109", type: "DECIMAL", sample: "450000.00" },
         { category: "Loan Terms", name: "Interest Rate", id: "3", type: "DECIMAL", sample: "6.875" },
         { category: "Milestones", name: "Estimated Closing Date", id: "763", type: "DATE", sample: '"11/20/2026"' },
         { category: "Milestones", name: "Active Milestone", id: "1393", type: "STRING", sample: '"Underwriting"' },
         { category: "Title Fees", name: "Lender's Title Insurance", id: "646", type: "DECIMAL", sample: "1250.00" },
         { category: "Title Fees", name: "Owner's Title Insurance", id: "647", type: "DECIMAL", sample: "450.00" },
         { category: "Title Fees", name: "Settlement / Escrow Fee", id: "648", type: "DECIMAL", sample: "600.00" },
         ];
         // Per-container caches. Scoped by persona so tenants can never see another
         // tenant's projection or schema results.
         const readCache = new Map();
         const fieldCache = new Map();
         const requestContext = new AsyncLocalStorage();
         const currentRequestId = () => {
         const context = requestContext.getStore();
         return context && context.requestId;
         };
         const log = (level, action, details = {}) =>
         console.log(
         JSON.stringify({
         timestamp: new Date().toISOString(),
         level,
         action,
         requestId: currentRequestId(),
         ...details,
         }),
         );
         const json = (statusCode, body, headers = {}) => ({
         statusCode,
         headers: { "Content-Type": "application/json", "Cache-Control": "no-store", ...headers },
         body: JSON.stringify(body),
         });
         const error = (statusCode, message, extra = {}) => json(statusCode, { error: message, ...extra });
         function safeEqual(a, b) {
         const left = Buffer.from(String(a));
         const right = Buffer.from(String(b));
         return left.length === right.length && timingSafeEqual(left, right);
         }
         function provisioningKeyFor(role, tenantName, email) {
         return createHash("sha256")
         .update(`${role}|${tenantName.trim().toLowerCase()}|${email.trim().toLowerCase()}`)
         .digest("hex");
         }
         function header(event, name) {
         const headers = event.headers || {};
         return headers[name] || headers[name.toLowerCase()] || headers[name.toUpperCase()];
         }
         function decode(value) {
         try {
         return decodeURIComponent(value);
         } catch {
         return value;
         }
         }
         function parseFields(raw) {
         const fields = String(raw || DEFAULT_FIELDS)
         .split(",")
         .map((field) => field.trim())
         .filter(Boolean);
         const unique = [...new Set(fields)];
         if (unique.length === 0 || unique.length > MAX_FIELDS) return null;
         if (unique.some((field) => !FIELD_ID.test(field))) return null;
         return unique;
         }
         function validFields(fields) {
         if (!fields || typeof fields !== "object" || Array.isArray(fields)) return false;
         const keys = Object.keys(fields);
         if (keys.length === 0 || keys.length > MAX_FIELDS) return false;
         return keys.every(
         (key) =>
         FIELD_ID.test(key) &&
         (["string", "number", "boolean"].includes(typeof fields[key]) || fields[key] === null),
         );
         }
         function escapeHtml(value) {
         return String(value).replace(/[&<>"']/g, (char) => ({
         "&": "&amp;",
         "<": "&lt;",
         ">": "&gt;",
         '"': "&quot;",
         "'": "&#39;",
         })[char]);
         }
         function parseIds(raw) {
         if (!raw) return null;
         const ids = String(raw).split(",").map((id) => id.trim()).filter(Boolean);
         const unique = [...new Set(ids)];
         if (unique.length === 0 || unique.length > MAX_FIELDS) return null;
         if (unique.some((id) => !FIELD_ID.test(id))) return null;
         return unique;
         }
         const isCustomField = (id) => id.startsWith("CX.") || /^CUST\d{2}FV$/.test(id);
         function collectDefinitions(entries, requested, target) {
         const wanted = new Set(requested);
         for (const entry of Array.isArray(entries) ? entries : []) {
         const id = String(entry.id ?? entry.fieldId ?? entry.fieldName ?? "");
         if (!wanted.has(id)) continue;
         const definition = {
         description: String(entry.description || ""),
         type: String(entry.format || entry.dataType || entry.type || "STRING").toUpperCase(),
         };
         if (typeof entry.readOnly === "boolean") definition.readOnly = entry.readOnly;
         if (typeof entry.fieldLock === "boolean") definition.fieldLock = entry.fieldLock;
         target[id] = definition;
         }
         }
         function roleFor(env, role) {
         const config = ROLE_CONFIG[role];
         if (!config) return null;
         const code = env[config.codeEnv];
         const persona = env[config.personaEnv];
         return code && persona ? { role, label: config.label, code, persona } : null;
         }
         function pickQuery(params, allowed) {
         const picked = {};
         for (const key of allowed) {
         const value = params && params[key];
         if (value === undefined || value === null || value === "") continue;
         if (!/^[A-Za-z0-9._-]{1,50}$/.test(String(value))) return null;
         picked[key] = String(value);
         }
         return picked;
         }
         // Native lifecycle query values such as loanFolder may contain spaces. Reject
         // control characters and cap length rather than forcing callers to pre-encode.
         function pickLooseQuery(params, allowed) {
         const picked = {};
         for (const key of allowed) {
         const value = params && params[key];
         if (value === undefined || value === null || value === "") continue;
         const text = String(value);
         if (text.length > 100 || /[\u0000-\u001f\u007f]/.test(text)) return null;
         picked[key] = text;
         }
         return picked;
         }
         const isRecord = (value) => Boolean(value) && typeof value === "object" && !Array.isArray(value);
         function parseJsonBody(event, limit = MAX_BODY_BYTES) {
         const body = String(event.body || "");
         if (Buffer.byteLength(body) > limit) return { response: error(413, "Request body too large") };
         try {
         return { value: JSON.parse(body || "null") };
         } catch {
         return { response: error(400, "Invalid JSON body") };
         }
         }
         function validEntityId(value) {
         return typeof value === "string" && value.length > 0 && value.length <= 200 && CONDITION_ID.test(value);
         }
         function validEntityReferences(value) {
         if (!Array.isArray(value) || value.length === 0 || value.length > MAX_CONDITION_UPDATES) return null;
         for (const reference of value) {
         if (!isRecord(reference) || !validEntityId(reference.entityId)) return null;
         if (reference.entityType !== undefined && (typeof reference.entityType !== "string" || reference.entityType.length > 50)) {
         return null;
         }
         }
         return value;
         }
         function standardConditionType(value) {
         const type = String(value || "").toLowerCase();
         return STANDARD_CONDITION_TYPES.has(type) ? type : null;
         }
         function extractLoanId(body, response) {
         const first = Array.isArray(body) ? body[0] : body;
         const candidates = [];
         if (typeof first === "string") candidates.push(first);
         if (isRecord(first)) candidates.push(first.id, first.loanId);
         const location = response && response.headers && response.headers.get("location");
         if (location) {
         const match = String(location).match(/\/loans\/([^/?#]+)/);
         if (match) candidates.push(decode(match[1]));
         }
         return (
         candidates.find((value) => typeof value === "string" && value.trim().length > 0 && value.length <= 200) || null
         );
         }
         // Only the fields the officially verified CreateAttachment contract accepts.
         function validUpload(payload) {
         if (!payload || typeof payload !== "object" || Array.isArray(payload)) return null;
         const file = payload.file;
         if (!file || typeof file !== "object" || Array.isArray(file)) return null;
         const name = typeof file.name === "string" ? file.name.trim() : "";
         const contentType = typeof file.contentType === "string" ? file.contentType.trim() : "";
         const size = Number(file.size);
         if (!name || name.length > 255) return null;
         if (!contentType || contentType.length > 100 || !contentType.includes("/")) return null;
         if (!Number.isFinite(size) || size < 0 || size > 1_000_000_000) return null;
         const upload = { file: { contentType, name, size } };
         if (payload.title !== undefined) {
         const title = typeof payload.title === "string" ? payload.title.trim() : "";
         if (!title || title.length > 255) return null;
         upload.title = title;
         }
         if (payload.assignTo !== undefined) {
         const assignTo = payload.assignTo;
         if (!assignTo || typeof assignTo !== "object" || Array.isArray(assignTo)) return null;
         const entityId = typeof assignTo.entityId === "string" ? assignTo.entityId.trim() : "";
         if (!entityId || entityId.length > 100 || assignTo.entityType !== "Document") return null;
         upload.assignTo = { entityId, entityType: "Document" };
         }
         return upload;
         }
         // Optional per-role write allowlist. Unset means any valid field ID; malformed
         // configuration fails closed so a typo cannot silently widen a role.
         function writeAllowlist(env, role) {
         const raw = env[`WRITE_FIELDS_${String(role || "").toUpperCase()}`];
         if (raw === undefined || raw === "") return null;
         const ids = String(raw).split(",").map((id) => id.trim()).filter(Boolean);
         if (ids.length === 0 || ids.some((id) => !FIELD_ID.test(id))) return new Set();
         return new Set(ids);
         }
         const html = (statusCode, body) => ({
         statusCode,
         headers: {
         "Content-Type": "text/html; charset=utf-8",
         "Cache-Control": "no-store",
         "Content-Security-Policy": "default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'",
         "X-Frame-Options": "DENY",
         },
         body,
         });
         function createHandler({ store, fetchImpl = globalThis.fetch, env = process.env, now = () => Date.now() } = {}) {
         if (!store) throw new Error("createHandler requires a store");
         const baseUrl = () => (env.ENCOMPASS_BASE_URL || "https://api.elliemae.com").replace(/\/+$/, "");
         const timeoutMs = () => Number(env.UPSTREAM_TIMEOUT_MS) || 8000;
         let credentials = null;
         async function credentialsForExchange() {
         if (!credentials) credentials = await store.getSecret();
         return credentials;
         }
         async function getScopedToken(encompassUserId) {
         const nowSeconds = Math.floor(now() / 1000);
         const cached = await store.getToken(encompassUserId);
         if (cached && cached.accessToken && cached.expiresAt > nowSeconds + TOKEN_SKEW_SECONDS) {
         log("INFO", "TOKEN_CACHE_HIT", { encompassUserId });
         return cached.accessToken;
         }
         log("INFO", "TOKEN_EXCHANGE_REQUEST", { encompassUserId });
         const secret = await credentialsForExchange();
         const body = new URLSearchParams({
         grant_type: "urn:ietf:params:oauth:grant-type:token-exchange",
         client_id: secret.clientId,
         client_secret: secret.clientSecret,
         subject_token_type: "urn:ietf:params:oauth:token-type:access_token",
         subject_user_id: encompassUserId,
         });
         const response = await fetchImpl(`${baseUrl()}/oauth2/v1/token`, {
         method: "POST",
         headers: { "Content-Type": "application/x-www-form-urlencoded", Accept: "application/json" },
         body: body.toString(),
         signal: AbortSignal.timeout(timeoutMs()),
         });
         if (!response.ok) {
